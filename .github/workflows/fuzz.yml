name: Fuzz testing

on:
  push:
    branches: [master,develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  pull_request:
    branches: [master,develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.planning/**'
  workflow_dispatch:

# A newer push to a pull request cancels its older run; every other run gets a group of its own,
# because a group holds one pending run and would otherwise drop queued develop or master pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Clang and LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Configure
        run: >
          cmake -B build
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DARGMIN_BUILD_FUZZ_TESTS=ON
          -DARGMIN_CMAKE_FETCH_DEPS=ON

      - name: Build fuzz targets
        run: cmake --build build -j$(nproc)
